<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perioda - Forgot Password</title>
    <link rel="stylesheet" href="login.css?v=2">
    <style>
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #8b6878;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #8e1d4f;
        }

        .back-link svg {
            vertical-align: middle;
            margin-right: 4px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <span class="logo-dot"></span>
                <span>perioda</span>
            </div>

            <h1 id="formTitle">Reset Password</h1>
            <p class="subtitle" id="formSubtitle">Verify your identity to reset your password.</p>

            <!-- STEP 1: Verify Identity -->
            <form id="verifyForm" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your registered phone number" maxlength="10" required>
                </div>

                <button type="submit" class="login-btn" id="verifyBtn">Verify Identity</button>
                <small id="verifyError" class="error-message"></small>
            </form>

            <!-- STEP 2: Reset Password -->
            <form id="resetForm" class="hidden" novalidate>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                        <button type="button" id="toggleNewPassword">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                        <button type="button" id="toggleConfirmPassword">Show</button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="resetBtn">Reset Password</button>
                <small id="resetError" class="error-message"></small>
                <small id="resetSuccess" class="success-message" style="color: green; text-align: center; display: block; margin-top: 10px;"></small>
            </form>

            <a href="login.html" class="back-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
                Back to Login
            </a>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>

</html>
