<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma" content="no-cache">

    <meta http-equiv="Expires" content="0">

    <title>Perioda - Login</title>

    <link rel="stylesheet" href="login.css?v=2">

    <style>
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #8b6878;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #8e1d4f;
        }

        .back-link svg {
            vertical-align: middle;
            margin-right: 4px;
        }
    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">


            <div class="logo">

                <span class="logo-dot"></span>

                <span>perioda</span>

            </div>


            <h1>
                Welcome back
            </h1>


            <p class="subtitle">
                Log in to continue tracking your cycle.
            </p>



            <form id="loginForm" novalidate>


                <!-- USERNAME / EMAIL -->

                <div class="form-group">

                    <label for="username">
                        Email
                    </label>

                    <input type="text" id="username" placeholder="Enter your email" required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input type="password" id="password" placeholder="Enter your password" required>

                        <button type="button" id="togglePassword">
                            Show
                        </button>

                    </div>

                </div>

                <div style="text-align: right; margin-bottom: 20px; margin-top: -10px;">
                    <a href="forgot-password.html" style="color: #8b6878; font-size: 13px; text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Log In
                </button>

                <small id="errorMessage" class="error-message"></small>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="registration.html">
                    Create an account
                </a>
            </p>

            <a href="index.html" class="back-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
                Back to landing page
            </a>


        </div>

    </div>


    <script src="login.js?v=4"></script>

</body>

</html>
